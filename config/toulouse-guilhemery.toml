# Point d'observation : 43°35'52.2"N 1°27'29.5"E
#
# Valeurs mesurées sur OpenStreetMap le 9 septembre 2026 par
# `nexttraintosee tracks -c config/toulouse-guilhemery.toml`, qui imprime le
# bloc [[branches]] à recopier ici.
#
# Géographie du secteur : au sud de Matabiau, toutes les lignes descendent
# ensemble sur environ deux kilomètres avant de se séparer aux bifurcations du
# Grand-Rond et d'Empalot. Le point d'observation est à 1,5 km de la gare, donc
# *dans* ce tronc commun : tout ce qui quitte Matabiau vers le sud passe devant,
# quelle que soit sa destination finale.

[site]
name = "Toulouse — sud de Matabiau (Guilheméry / Port Saint-Sauveur)"
lat = 43.597833
lon = 1.458194
anchor_station = "Toulouse Matabiau"
anchor_lat = 43.6112
anchor_lon = 1.4535
search_radius_m = 500
# Temps de se poster à la fenêtre. S'ajoute à l'incertitude pour former l'heure
# annoncée : rater un passage coûte bien plus que d'attendre vingt secondes.
lead_margin_s = 20.0

[profile]
# Automoteur régional en sortie de gare urbaine. À recaler avec `calibrate`.
accel_ms2 = 0.5
decel_ms2 = 0.6
# 120 km/h est la vitesse limite relevée sur OpenStreetMap pour les trois
# corridors du secteur ; c'est un plafond d'infrastructure, pas la marche réelle
# d'un TER en sortie de gare — `calibrate` ajustera.
line_speed_kmh = 120.0
# Mesurée sur la géométrie OSM du site : 1 564 m de voie pour 1 534 m à vol
# d'oiseau. Sert de repli pour une branche dont la distance n'a pas été relevée.
sinuosity = 1.02

# --- Branches au départ de Toulouse-Matabiau --------------------------------
# `bearing_deg` = cap depuis la gare vers les gares situées sur la branche.
# `passes_observer` = cette branche passe-t-elle devant le point d'observation ?

[[branches]]
id = "se"
label = "Axe Narbonne / Sète (via Montaudran)"
bearing_deg = 137.5
passes_observer = true
# Corridor c2, à 383 m du point (un second, c3, à 488 m, porte le même axe).
track_distance_m = 1565.0
# Ajusté par `validate --fit` sur le parcours le plus rapide vers Montaudran
# (4887 m en 5 min 00 s). Bien en deçà des 120 km/h de l'infrastructure : la
# marche réelle vers Montaudran est nettement plus lente que la limite de voie.
line_speed_kmh = 66.0

[[branches]]
id = "sud"
label = "Axe Latour-de-Carol / Bayonne / Auch (via Saint-Agne)"
bearing_deg = 184.2
passes_observer = true
# Corridor c1, à 1 m du point : les voies passent au ras de la position.
track_distance_m = 1564.0
# 60 km/h n'est pas la limite de l'infrastructure : c'est la vitesse unique qui
# reproduit, sur ces 1 564 m, le profil relevé sur OpenStreetMap — 30 km/h sur
# les 358 premiers mètres d'avant-gare, puis 90. Le modèle n'appliquant qu'une
# vitesse par branche, c'est la seule façon d'y représenter un profil non
# uniforme.
#
# La valeur précédente, 113 km/h, venait de `validate --fit` calé sur le
# parcours entier vers Saint-Agne (3 836 m en 3 min). Elle est juste pour ce
# parcours-là, où un début lent est compensé par une fin à 130 km/h ou plus —
# mais fausse de +29 s sur le seul tronçon qui nous intéresse.
line_speed_kmh = 60.0

[[branches]]
id = "nord"
label = "Axe Bordeaux / Montauban"
bearing_deg = 348.6
passes_observer = false

[[branches]]
id = "ouest"
label = "Axe Auch / Colomiers (desserte directe, sans arrêt à Saint-Agne)"
bearing_deg = 269.8
# Contre-intuitif mais exact : Colomiers est plein ouest de Matabiau, alors que
# les trains qui s'y rendent partent vers le SUD. La ligne de Saint-Agne à Auch
# descend d'abord avec les autres, bifurque vers l'ouest après Saint-Agne, puis
# remonte vers Saint-Cyprien-Arènes et Colomiers. Une desserte directe
# Matabiau -> Colomiers donne donc un cap de 270° tout en passant devant le point.
# `tracks` ne trouve aucun corridor à ce cap, et c'est attendu : la géométrie ne
# peut pas savoir qu'une desserte annoncée vers l'ouest part en réalité au sud.
# Le maintien à true est donc une décision, pas un oubli.
passes_observer = true
track_distance_m = 1564.0   # même tronc commun que la branche « sud »
line_speed_kmh = 60.0       # idem : même avant-gare, même profil

# --- Types de matériel ------------------------------------------------------
# Les circulations sont rattachées à la première catégorie dont le motif
# reconnaît leur désignation (numéro, code et intitulé de ligne). Le profil
# d'une catégorie l'emporte sur celui de la branche : une vitesse de branche est
# calée sur les omnibus qui desservent les haltes de l'axe, et n'a pas à
# s'imposer à un train qui les traverse.

[[categories]]
id = "ter"
label = "TER Occitanie (omnibus)"
pattern = "\\b8\\d{5}\\b"
# Vitesse laissée à la branche : 113 km/h vers Saint-Agne, 66 vers Montaudran,
# mesurées sur les horaires les plus tendus de ces omnibus.
accel_ms2 = 0.5
decel_ms2 = 0.6

[[categories]]
id = "grandes-lignes"
label = "Intercités / TGV (sans arrêt)"
pattern = "\\b\\d{4,5}\\b"
# ESTIMATION, non mesurable sur les horaires : ces trains ne s'arrêtent ni à
# Saint-Agne ni à Montaudran, donc aucun segment encadrant le point ne les
# concerne. Ils traversent sans s'arrêter, la vitesse de branche calée sur les
# omnibus ne s'applique donc pas — on retient la limite d'infrastructure relevée
# sur OSM. L'accélération est celle d'une rame tractée, plus lente qu'un
# automoteur. À confirmer au capteur.
accel_ms2 = 0.35
decel_ms2 = 0.50
# Même raisonnement que pour les branches : l'avant-gare à 30 km/h est de
# l'infrastructure, elle s'impose à un TGV comme à un omnibus. La vitesse
# équivalente au profil relevé, pour une rame tractée, est de 59 km/h — et non
# les 120 de la limite de voie, qui donnaient 24 s d'avance.
line_speed_kmh = 59.0

[data]
gtfs_path = "../data/sncf-gtfs.zip"
overpass_cache = "../cache/overpass"
database = "../data/nexttraintosee.sqlite"

[sensor]
trigger_db = 9.0
release_db = 4.0
min_duration_s = 3.0
max_duration_s = 120.0
refractory_s = 15.0
baseline_half_life_s = 90.0
sample_rate_hz = 16000
block_seconds = 0.5
